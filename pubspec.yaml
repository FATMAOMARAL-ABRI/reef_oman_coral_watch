name: reef_oman_coral_watch
description: Reef Oman Coral-Watch Citizen Science

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Device / connectivity
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0

  # GPS / location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Storage / offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media
  image_picker: ^1.0.7
  camera: ^0.11.0+1
  image: ^4.2.0
  exif: ^3.1.2

  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.6.4
  firebase_messaging: ^15.1.3

  # Network / sharing / charts
  dio: ^5.7.0
  share_plus: ^12.0.1
  fl_chart: ^1.1.1

  # Other
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Hive generator tools
  hive_generator: ^2.0.1

  build_runner: ^2.4.13  
flutter:
  uses-material-design: true
  assets:
    - assets/coral_model/

